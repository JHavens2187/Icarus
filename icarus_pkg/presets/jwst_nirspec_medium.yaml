# ==============================================================================
# ICARUS v3.4 Preset: JWST NIRSpec Medium-Resolution Gratings (G140M/G235M/G395M)
# Optimized for JADES DR3/v4 (DJA & MAST), CEERS, MEGA, and COSMOS-3D coadds.
# ==============================================================================
globals:
  line_table: "icarus_master_lines.fits"
  lines: "all"
  wave_unit: "um"
  flux_unit: "1e-20 erg / (cm2 s AA)"
  resolution: "300.0 km / s"
  dispersion_curve: "jwst_nirspec_medium_disp.fits"
  column_mapping:
    wave: "WAVE"
    flux: "FLUX"
    err: "ERR"
  H0: 70.0
  Om0: 0.3
  fitting:
    cont_type: "powerlaw_feii"
    continuum_degree: 2
    enable_feii: true
    cont_width: "500.0 Angstrom"
    center: "constrained"
    snr_threshold: 3.0
    min_sigma: "30.0 km / s"
    max_sigma: "450.0 km / s"
    broad_kinematics:
      min_sigma: "500.0 km / s"
      max_sigma: "8000.0 km / s"

setups:
  G140M:
    resolution: "290.0 km / s"
    dispersion_curve: "jwst_nirspec_medium_disp.fits"
  G235M:
    resolution: "285.0 km / s"
    dispersion_curve: "jwst_nirspec_medium_disp.fits"
  G395M:
    resolution: "280.0 km / s"
    dispersion_curve: "jwst_nirspec_medium_disp.fits"