# ==============================================================================
# ICARUS v3.4 Preset: Nancy Grace Roman Wide Field Instrument (WFI) Grism (R ~ 600)
# ==============================================================================
globals:
  line_table: "icarus_master_lines.fits"
  lines: "all"
  wave_unit: "AA"
  flux_unit: "1e-17 erg / (cm2 s AA)"
  resolution: "500.0 km / s"
  column_mapping:
    wave: "WAVELENGTH"
    flux: "FLUX"
    err: "ERROR"
  H0: 70.0
  Om0: 0.3
  fitting:
    cont_type: "powerlaw_feii"
    continuum_degree: 2
    enable_feii: true
    cont_width: "500.0 Angstrom"
    center: "constrained"
    snr_threshold: 3.0
    min_sigma: "40.0 km / s"
    max_sigma: "450.0 km / s"
    broad_kinematics:
      min_sigma: "900.0 km / s"
      max_sigma: "8000.0 km / s"