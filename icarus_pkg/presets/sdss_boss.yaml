# ==============================================================================
# ICARUS v3.4 Preset: SDSS / eBOSS Optical Spectroscopy (R ~ 2000)
# Automatically maps SDSS `loglam` (log10 AA) and `ivar` (inverse variance).
# ==============================================================================
globals:
  line_table: "icarus_master_lines.fits"
  lines: "all"
  wave_unit: "AA"
  flux_unit: "1e-17 erg / (cm2 s AA)"
  resolution: "150.0 km / s"
  column_mapping:
    loglam: "loglam"
    flux: "flux"
    ivar: "ivar"
    mask: "and_mask"
  H0: 70.0
  Om0: 0.3
  fitting:
    cont_type: "powerlaw_feii"
    continuum_degree: 2
    enable_feii: true
    cont_width: "500.0 Angstrom"
    center: "constrained"
    snr_threshold: 3.0
    min_sigma: "30.0 km / s"
    max_sigma: "450.0 km / s"
    broad_kinematics:
      min_sigma: "800.0 km / s"
      max_sigma: "8000.0 km / s"